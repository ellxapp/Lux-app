name: B2 rapid model gate
on:
  pull_request:
    paths: ['study/b2/**', '.github/workflows/b2-gate.yml']
  workflow_dispatch:
jobs:
  b2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test study/b2/*.test.mjs
      - run: node study/b2/cli.mjs
